<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Family lists launcher (GL1). Engine Room / Build family shared lists app, 2026-11-07 PT. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Our Lists</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Lists">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<style>
  html,body{margin:0;height:100%;background:#f6f4ef;font-family:system-ui,-apple-system,sans-serif;color:#1f2a24}
  @media (prefers-color-scheme: dark){html,body{background:#121714;color:#eef3ef}}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .msg{max-width:420px;margin:0 auto;padding:80px 24px;text-align:center;line-height:1.5}
  .msg img{width:120px;height:120px;border-radius:28px}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="msg" id="msg"><img src="icon-192.png" alt=""><p>Loading your lists&hellip;</p></div>
<script>
(function () {
  var key = '';
  var m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) key = m[1];
  try { if (key) localStorage.setItem('gl_key', key); else key = localStorage.getItem('gl_key') || ''; } catch (e) {}
  var msg = document.getElementById('msg');
  if (!key || !window.GL_EXEC || /PASTE/.test(window.GL_EXEC)) {
    msg.innerHTML = '<img src="icon-192.png" alt=""><p><b>Open the full link Lucas sent you</b> once, then add it to your home screen.</p>';
    return;
  }
  // keep the key in the address so an iPhone home-screen copy has it too
  if (!m && history.replaceState) history.replaceState(null, '', '#k=' + key);
  var f = document.createElement('iframe');
  f.src = window.GL_EXEC + '?k=' + encodeURIComponent(key);
  f.allow = 'microphone; clipboard-write';
  f.title = 'Our Lists';
  f.onload = function () { msg.style.display = 'none'; };
  document.body.appendChild(f);
})();
</script>
</body>
</html>
