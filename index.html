<html>
<head>
<meta charset="utf-8">

<!-- Family Lists (GL1) web app page. Engine Room / Continue family grocery list app. GL1.6 look: Mon Nov 9 2026 12:40 AM PT; GL1.7 Tue Nov 10 9:30 AM PT: cart ticks keep aisle colour, toast always dark; GL1.9 Fri Nov 13 11:15 PM PT: Paste a key button (Smart helper); GL1.10 Sat Nov 14 PT: House rules
     (Lucas: simple, colourful, practical for Brittany). Each list has its own colour, each aisle its own colour,
     in-app dialogs (no browser pop-ups), Usuals quick-add, Undo on remove, cart progress bar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f3; --card:#ffffff; --ink:#22262a; --muted:#737b83; --line:#ece6dc;
  --accent:#2f9e6e; --accent-ink:#ffffff; --done:#a9b0b6; --warn:#d6453d;
  --green:#2e9e5b; --red:#d6453d; --amber:#d99a1e;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, var(--card));
  --shadow:0 1px 2px rgba(34,38,42,.05),0 6px 20px rgba(34,38,42,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171a; --card:#1e2226; --ink:#eef1f3; --muted:#9aa3ab; --line:#2c3238; --done:#5f676e; --warn:#f06a5f;
    --green:#4cc27e; --red:#f06a5f; --amber:#f0b545;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:17px}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:8px;box-shadow:0 1px 0 var(--line)}
.top::before{content:"";display:block;height:5px;background:var(--accent);transition:background .3s}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.badge{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:24px;flex:none;transition:background .3s}
.htxt{flex:1;min-width:0}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--muted);font-size:14px;font-weight:600}
.prog{max-width:640px;margin:10px auto 0;padding:0 16px;display:none}
.prog.on{display:block}
.prog .track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;border-radius:99px;background:var(--accent);transition:width .35s}
main{padding:6px 16px 150px;max-width:640px;margin:0 auto}
.section{margin-top:18px}
.section h2{font-size:14px;font-weight:800;color:var(--cc,var(--muted));margin:0 2px 8px;display:flex;gap:8px;align-items:center}
.section h2 .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:99px;background:color-mix(in srgb, var(--cc,var(--muted)) 14%, var(--card))}
.section h2 .n{color:var(--muted);font-weight:700;font-size:13px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border-left:5px solid var(--cc,transparent)}
.item{display:flex;align-items:center;gap:12px;padding:13px 6px 13px 14px;border-top:1px solid var(--line);min-height:58px;cursor:pointer}
.item:first-child{border-top:0}
.box{width:28px;height:28px;border-radius:50%;border:2.5px solid color-mix(in srgb, var(--cc,var(--accent)) 55%, var(--line));flex:none;display:grid;place-items:center;transition:transform .15s,background .15s}
.item.done .box{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent))}
.item.done .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item.pop .box{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.25)}}
.name{flex:1;font-weight:700;line-height:1.25;min-width:0}
.meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
.who-dot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-weight:800}
.item.done .name{color:var(--done);text-decoration:line-through}
.more{border:0;background:none;color:var(--muted);font-size:22px;padding:6px 10px;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-weight:600}
.empty b{display:block;font-size:52px;margin-bottom:10px}
.clear{display:block;margin:18px auto 0;border:0;background:var(--accent-soft);color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:11px 20px;border-radius:999px}
.usuals{margin-top:14px}
.usuals .lab{font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 8px}
.urow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.urow::-webkit-scrollbar{display:none}
.uchip{flex:none;border:0;background:var(--accent-soft);color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:9px 14px;border-radius:999px;white-space:nowrap}
.uchip b{color:var(--accent);margin-right:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:14px 12px calc(12px + env(safe-area-inset-bottom))}
.bar form{max-width:640px;margin:0 auto;display:flex;gap:8px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:6px;border:2px solid var(--accent-soft)}
.bar input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:10px 12px;outline:none;min-width:0}
.round{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.mic{background:var(--accent-soft);color:var(--accent)}
.mic.on{background:var(--warn);color:#fff;animation:pulse 1.2s infinite}
.add{background:var(--accent);color:var(--accent-ink);font-size:26px;font-weight:700}
@keyframes pulse{50%{transform:scale(1.08)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:#22262a;color:#fff;
  padding:11px 16px;border-radius:14px;font-size:15px;font-weight:700;transition:.25s;max-width:92vw;z-index:30;pointer-events:none;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.act{pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:800;padding:2px 4px;filter:brightness(1.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:.25s;max-width:640px;margin:0 auto}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[data-cat]{border-color:color-mix(in srgb, var(--cc) 45%, var(--line))}
.chip[data-cat].sel{background:var(--cc);border-color:var(--cc);color:#fff}
.row2{display:flex;gap:8px}
.row2 button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row2 .danger{color:var(--warn)}
.who{display:flex;gap:10px;justify-content:center;margin-top:16px}
.who button{font:inherit;font-weight:800;font-size:18px;padding:14px 26px;border-radius:16px;border:0;color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none;max-width:640px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid transparent;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
.tab.sel{background:var(--tc);color:#fff;border-color:var(--tc)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:99px;font-size:12px;line-height:20px;text-align:center;background:color-mix(in srgb, var(--tc) 18%, var(--card));color:var(--ink)}
.tab.sel .n{background:rgba(255,255,255,.28);color:#fff}
.tab.new{box-shadow:none;border:2px dashed var(--line);background:none;color:var(--muted)}
.day{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}.day.past{opacity:.5}.day.today{background:var(--accent-soft)}
.dl{flex:none;width:64px;font-weight:800;font-size:14px;line-height:1.3}.dl small{display:block;color:var(--muted);font-weight:600}
.dm{flex:1;min-width:0}.slot{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:3px 0;line-height:1.3}
.slot b{font-weight:800;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}.slot.empty{color:var(--muted)}
.pref{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 6px 6px 12px;margin:0 6px 8px 0;font-size:14px;font-weight:700}
.pref button{border:0;background:var(--bg);color:var(--muted);border-radius:50%;width:26px;height:26px;font-size:13px}
.pp{margin:10px 4px 2px;font-weight:800;font-size:14px}.hint{color:var(--muted);font-size:13px;font-weight:600;margin:10px 4px}
.row3{display:flex;gap:8px;margin-top:14px}.row3 button{flex:1;font:inherit;font-weight:700;font-size:15px;padding:10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.sheet{max-height:88vh;overflow-y:auto}
.gbtn{display:block;width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:16px;padding:14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink)}
.gi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:11px 4px}
.gi:first-child{border-top:0}.gi .dot{width:16px;height:16px;border-radius:50%;flex:none}
.gi.need .dot{background:var(--red)}.gi.have .dot{background:var(--green)}.gi.list .dot{background:var(--amber)}
.gi .gn{flex:1;min-width:0;font-weight:700}.gi .gw{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi.have .gn{color:var(--muted)}.gi .st{font-size:13px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 6px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.wk{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
#gadd{position:sticky;bottom:0;box-shadow:0 -10px 14px var(--card)}
.gcheck{position:sticky;top:-18px;z-index:2;background:var(--card);padding:8px 0 6px;margin-top:4px}
.gcheck form{display:flex;gap:8px;align-items:center;border:2px solid var(--accent-soft);border-radius:999px;padding:4px}
.gcheck input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:8px 10px;outline:none}
.gcheck .round{width:40px;height:40px}.gcheck .hint2{font-size:12px;font-weight:600;color:var(--muted);margin:5px 4px 0}
.gi .amt{font-weight:800;color:var(--ink)}
/* in-app dialog (GL1.6: replaces the browser's confirm/prompt boxes) */
.dlg-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px}
.dlg-bg.open{display:flex}
.dlg{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:20px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .18s}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.dlg h4{margin:0 0 6px;font-size:19px;font-weight:800}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:15px;font-weight:600}
.dlg input{width:100%;font:inherit;font-weight:600;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid var(--accent-soft);background:var(--bg);color:var(--ink);outline:none;margin-bottom:14px}
.dlg input:focus{border-color:var(--accent)}
.dlg .btns{display:flex;flex-direction:column;gap:8px}
.dlg .btns button{font:inherit;font-weight:800;font-size:16px;padding:13px;border-radius:14px;border:0;background:var(--bg);color:var(--ink)}
.dlg .btns .main{background:var(--accent);color:var(--accent-ink)}
.dlg .btns .danger{background:var(--warn);color:#fff}
</style>
</head>
<body>
<div class="top">
  <header><div class="badge" id="badge"></div><div class="htxt"><h1 id="title">Shopping</h1><div class="sub" id="sub">Loading&#x2026;</div></div></header>
  <div class="prog" id="prog"><div class="track"><div class="fill" id="pfill" style="width:0"></div></div></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="list"></main>

<div class="bar"><form id="f" autocomplete="off">
  <button type="button" class="round mic" id="mic" aria-label="Speak items">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <input id="t" placeholder="Add milk, eggs, bananas&#x2026;" enterkeyhint="done">
  <button class="round add" aria-label="Add">+</button>
</form></div>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"></div>
<div class="dlg-bg" id="dlgbg"><div class="dlg" id="dlg"></div></div>

<script>
(function(){ var has = /k=[A-Za-z0-9]+/.test(location.hash); try { has = has || !!localStorage.getItem('gl_key'); } catch(e) {}
  if (has) return; window.GL_NOKEY = true; document.addEventListener('DOMContentLoaded', function(){
    document.body.innerHTML = '<div style="font-family:Nunito,system-ui,sans-serif;max-width:420px;margin:0 auto;padding:56px 24px;text-align:center;line-height:1.5;color:#22262a">' +
      '<img src="icon-192.png" alt="" style="width:96px;height:96px;border-radius:22px"><h2 style="margin:16px 0 6px">Almost there</h2>' +
      '<p style="margin:0 0 16px">Copy the link Lucas sent you, paste it here, and tap Open. You only do this once.</p>' +
      '<input id="lk" placeholder="Paste the link" style="width:100%;box-sizing:border-box;font-size:17px;padding:14px;border:2px solid #ffb27a;border-radius:14px">' +
      '<button id="go" style="margin-top:12px;width:100%;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:14px;background:#ff7a2e;color:#fff">Open</button>' +
      '<p id="bad" style="color:#d6453d;display:none">That link has no family code in it. Copy the whole link.</p></div>';
    document.getElementById('go').onclick = function(){ var m = String(document.getElementById('lk').value).match(/k=([A-Za-z0-9]{8,})/) || String(document.getElementById('lk').value).trim().match(/^([A-Za-z0-9]{12,})$/);
      if (!m) { document.getElementById('bad').style.display = 'block'; return; }
      try { localStorage.setItem('gl_key', m[1]); } catch(e) {} location.hash = 'k=' + m[1]; location.reload(); }; }); })();
</script>
<script>
function E(){ return String.fromCodePoint.apply(null, arguments); }
var KEY = ''; (function(){ var m = location.hash.match(/k=([A-Za-z0-9]+)/); if (m) KEY = m[1];
  try { if (KEY) localStorage.setItem('gl_key', KEY); else KEY = localStorage.getItem('gl_key') || ''; } catch(e) {}
  if (KEY && !m && history.replaceState) history.replaceState(null, '', '#k=' + KEY); })();
var EMOJI = {"Produce":E(0x1f96c),"Bakery":E(0x1f956),"Deli":E(0x1f96a),"Meat & Seafood":E(0x1f969),"Dairy & Eggs":E(0x1f95b),"Frozen":E(0x1f9ca),"Pasta, Rice & Grains":E(0x1f35d),
  "Canned & Jarred":E(0x1f96b),"Baking & Spices":E(0x1f9c2),"Condiments":E(0x1f36f),"Breakfast & Cereal":E(0x1f963),"Snacks":E(0x1f37f),"Drinks":E(0x1f9c3),"Household":E(0x1f9fb),
  "Personal Care":E(0x1f9f4),"Baby & Kids":E(0x1f37c),"Pet":E(0x1f43e),"Hardware & Garden":E(0x1f528),"Other":E(0x1f6d2)};
/* GL1.6 colours: every aisle and every list gets its own. */
var CAT_COLOR = {"Produce":"#38a85a","Bakery":"#d98a2b","Deli":"#e2694b","Meat & Seafood":"#d94a5f","Dairy & Eggs":"#3d8fe0","Frozen":"#1fb3d1","Pasta, Rice & Grains":"#c79a1c",
  "Canned & Jarred":"#b8693a","Baking & Spices":"#a8703f","Condiments":"#e0a02a","Breakfast & Cereal":"#ec7f2d","Snacks":"#e5508f","Drinks":"#5b74e6","Household":"#7c64e0",
  "Personal Care":"#bb5bd6","Baby & Kids":"#ef7fae","Pet":"#8c785f","Hardware & Garden":"#5f7a8f","Other":"#8a9199"};
var LIST_COLOR = {"Shopping":"#2f9e6e","Gift Ideas":"#e0457b","Notes":"#e09b00","Meals":"#f0652f"};
var EXTRA_COLORS = ["#4f7cff","#8b5cf6","#14a7a0","#e05a9b","#3fa34d"];
var WHO_COLOR = {"Lucas":"#3d8fe0","Brittany":"#a24fe0"};
var state = {rows:[], order:[], lists:[], counts:{}, sorted:true, list:'Shopping', usuals:[]};
var meals = null; var MEALS = 'Meals';
var cur = 'Shopping'; try { cur = localStorage.getItem('gl_list') || 'Shopping'; } catch(e) {}
var who = null; try { who = localStorage.getItem('gl_who'); } catch(e) {}
var $ = function(id){ return document.getElementById(id); };

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(msg, label, fn){ var t=$('toast'); t.innerHTML=''; var sp=document.createElement('span'); sp.textContent=msg; t.appendChild(sp);
  t.classList.toggle('act', !!label);
  if (label){ var b=document.createElement('button'); b.textContent=label; b.onclick=function(){ t.classList.remove('show','act'); fn(); }; t.appendChild(b); }
  t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(function(){t.classList.remove('show','act');}, label ? 5000 : 2600); }
/* GitHub copy: plain fetch POST (text/plain, no cookies) to the web app's JSON door. */
function call(fn){ var a=[].slice.call(arguments,1);
  return fetch(window.GL_EXEC, {method:'POST', credentials:'omit', redirect:'follow', body: JSON.stringify({k:a[0], fn:fn, args:a.slice(1)})})
    .then(function(r){ return r.text(); })
    .then(function(t){ var j; try { j = JSON.parse(t); } catch(e) { oldApp(); throw new Error('Bad reply: ' + t.slice(0,80)); }
      if (!j.ok) throw new Error(j.error || 'Error'); return j.data; }); }
/* Until the web app has its JSON door, fall back to the old full-page app. */
function oldApp(){ if (oldApp.done || !KEY) return; oldApp.done = true; document.body.innerHTML = '';
  var f = document.createElement('iframe'); f.src = window.GL_EXEC + '?k=' + encodeURIComponent(KEY); f.allow = 'microphone; clipboard-write';
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0'; document.body.appendChild(f); }
function fail(e){ toast('Could not reach the list. Check your connection.'); console.log(e); }
function listColor(name){
  if (LIST_COLOR[name]) return LIST_COLOR[name];
  var i = 0; for (var j=0;j<name.length;j++) i += name.charCodeAt(j); return EXTRA_COLORS[i % EXTRA_COLORS.length];
}
function listEmoji(name){ if (name===MEALS) return E(0x1f37d); var l = state.lists.filter(function(x){return x.name===name;})[0]; return (l && l.emoji) || E(0x1f4cb); }

/* GL1.6 in-app dialog. ask({title, text, input, value, placeholder, buttons:[{label, value, kind:'main'|'danger'}]}) -> Promise(value or null) */
function ask(o){
  return new Promise(function(done){

    '</div>' : '<div style="height:14px"></div>')+'<div class="row2"><button id="ren">Rename</button><button class="danger" id="del">Remove</button></div>';
  $('sheet').classList.add('open'); $('sbg').classList.add('open');
  $('sheet').querySelectorAll('[data-cat]').forEach(function(b){ b.onclick = function(){
    r.category = b.dataset.cat; closeSheet(); render(); toast('Moved to '+r.category+'. Learned.');
    call('apiSetCategory',KEY,id,r.category,cur).then(set).catch(fail); }; });
  $('ren').onclick = function(){ closeSheet(); ask({title:'Rename', input:true, value:r.item, ok:'Save'}).then(function(v){ if (v && v.trim() && v.trim()!==r.item) call('apiRename',KEY,id,v.trim(),cur).then(set).catch(fail); }); };
  $('del').onclick = function(){ var list = cur, text = r.item;
    state.rows = state.rows.filter(function(x){return x.id!==id;}); closeSheet(); render();
    call('apiDelete',KEY,id,list).then(set).catch(fail);
    toast('Removed '+text+'.', 'Undo', function(){ call('apiAdd',KEY,text,who||'',list).then(function(d){ toast('Put back.'); set(d.list); }).catch(fail); }); };
}
function closeSheet(){ stopCheck(); $('sheet').classList.remove('open'); $('sbg').classList.remove('open'); }
$('sbg').onclick = closeSheet;

/* First open: ask who this phone belongs to (used for "Added by"). */
function askWho(){
  $('sheet').innerHTML = '<h3>Whose phone is this?</h3><div class="sub">So the list shows who added what.</div>'+
    '<div class="who"><button data-w="Lucas" style="background:'+WHO_COLOR.Lucas+'">Lucas</button><button data-w="Brittany" style="background:'+WHO_COLOR.Brittany+'">Brittany</button></div>';
  $('sheet').classList.add('open'); $('sbg').classList.add('open');
  $('sheet').querySelectorAll('[data-w]').forEach(function(b){ b.onclick=function(){ who=b.dataset.w; try{localStorage.setItem('gl_who',who);}catch(e){} closeSheet(); toast('Hi '+who+'! '+E(0x1f44b)); }; });
}

if (!window.GL_NOKEY) { applyTheme(); load(); if (!who) askWho(); }
setInterval(function(){ if (!window.GL_NOKEY && !document.hidden && !rec && !gListen && !$('dlgbg').classList.contains('open')) load(); }, 20000);
document.addEventListener('visibilitychange', function(){ if (!window.GL_NOKEY && !document.hidden) load(); });
</script>
</body>
